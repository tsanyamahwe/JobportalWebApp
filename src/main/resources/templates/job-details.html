<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Details</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/7.3.0/css/all.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --navy: #002244; --brand: #fb4f14; --ink: #1d2433; --muted: #6b7280; --line: #e5e7eb; }

        body.jd-page { background-color: var(--navy); font-family: 'Montserrat', system-ui, sans-serif; color: var(--ink); min-height: 100vh; }
        body.jd-page header.navbar { background-color: var(--navy); }

        .brand-link { color: #fff; text-decoration: none; }
        .nav-link i { margin-right: .4rem; }

        /* Active menu item: orange, like the Logout button */
        .navbar .navbar-nav .nav-link.active,
        .navbar .navbar-nav .nav-link.active:hover,
        .navbar .navbar-nav .nav-link.active:focus {
            color: var(--brand) !important;
            font-weight: 600;
        }
        .navbar .navbar-nav .nav-link:hover { color: var(--brand); }

        /* Layout: empty sidebar on the left, cards on the right */
        body.jd-page .section { display: flex; gap: 2rem; padding: 1.5rem 2rem 3rem; }
        body.jd-page .sidenav { flex: 0 0 280px; }
        body.jd-page .sidenav hr { border-color: rgba(255,255,255,.35); opacity: 1; margin-top: 1.5rem; }
        body.jd-page article { flex: 1; min-width: 0; }
        @media (max-width: 991.98px) {
            body.jd-page .section { padding: 1rem; }
            body.jd-page .sidenav { display: none; }
        }

        /* Cards */
        body.jd-page .box { background: #fff; border-radius: 18px; padding: 1.5rem 1.75rem; margin-bottom: 1.5rem; }
        body.jd-page #back-link { display: inline-block; color: var(--ink); text-decoration: none; font-size: .95rem; cursor: pointer; }
        body.jd-page #back-link:hover { color: var(--brand); }
        body.jd-page .primary-title { font-size: 2.6rem; font-weight: 400; margin: .75rem 0 1rem; }
        body.jd-page .job-title { font-size: 1.25rem; font-weight: 700; color: var(--navy); margin-bottom: .35rem; }
        body.jd-page .large-label { font-size: 1.5rem; font-weight: 600; display: block; margin-bottom: .75rem; }
        body.jd-page .job-row { border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
        body.jd-page .job-row label { display: block; }
        body.jd-page .job-description { line-height: 1.65; color: #374151; }

        /* Edit / Delete buttons */
        body.jd-page .btn-sec { border: 0; border-radius: 8px; padding: .75rem 1rem; font-weight: 600; color: #fff; }
        body.jd-page .btn-red { background: var(--brand); }
        body.jd-page .btn-black { background: var(--ink); }
        body.jd-page .btn-sec:hover { opacity: .9; }
    </style>
</head>
<body class="jd-page">

<!-- ============ NAVBAR ============ -->
<header class="navbar navbar-expand-lg navbar-dark">
    <a class="navbar-brand ms-5 fw-bold h5 mb-0 brand-link" th:href="@{/}">gatesajobs<span class="logo_com fw-bold h5">.com</span></a>

    <button class="navbar-toggler me-3"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarToggler"
            aria-controls="navbarToggler"
            aria-expanded="false"
            aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarToggler">
        <ul class="navbar-nav m-auto mt-2 mt-lg-0">
            <li class="nav-item">
                <a sec:authorize="hasAuthority('Job Seeker')" class="nav-link active" th:href="@{/dashboard/search}"><i class="fa-solid fa-magnifying-glass"></i>Search for Jobs</a>
            </li>
            <li class="nav-item">
                <a sec:authorize="hasAuthority('Job Seeker')" class="nav-link" th:href="@{/saved-jobs}"><i class="fa-solid fa-eye"></i>View Saved Jobs</a>
            </li>
            <li class="nav-item">
                <a sec:authorize="hasAuthority('Job Seeker')" class="nav-link" th:href="@{/job-seeker-profile}"><i class="fa-solid fa-pencil"></i>Edit Profile</a>
            </li>
            <li class="nav-item">
                <a sec:authorize="hasAuthority('Recruiter')" class="nav-link" th:href="@{/dashboard/add}"><i class="fa-solid fa-file-circle-plus"></i>Post New Job</a>
            </li>
            <li class="nav-item">
                <a sec:authorize="hasAuthority('Recruiter')" class="nav-link active" th:href="@{/dashboard}"><i class="fa-solid fa-eye"></i>View Your Jobs</a>
            </li>
            <li class="nav-item">
                <a sec:authorize="hasAuthority('Recruiter')" class="nav-link" th:href="@{/recruiter-profile}"><i class="fa-solid fa-pencil"></i>Edit Account</a>
            </li>
        </ul>

        <img class="rounded-circle me-3"
             height="50" width="50" alt="Profile photo"
             th:if="${user != null and user.photosImagePath != null}"
             th:src="@{${user.photosImagePath}}"/>

        <label th:if="${user != null and user.firstName != null and user.lastName != null}"
               th:text="${user.firstName + ' ' + user.lastName}"
               class="nav-item nav-link px-2 me-3"></label>
        <label th:unless="${user != null and user.firstName != null and user.lastName != null}"
               th:text="${username}"
               class="nav-item nav-link px-2 me-3"></label>

        <button class="myBtn-light me-5" onclick="window.location.href='/logout'">Logout</button>
    </div>
</header>

<!-- ============ PAGE CONTENT ============ -->
<section class="section">

    <!-- Sidebar (empty, as in the design) -->
    <div class="sidenav">
        <hr/>
    </div>

    <article>
        <!-- Card 1: title, location, company -->
        <div class="box">
            <a class="primary" id="back-link" th:href="@{/dashboard}"><i class="fa-solid fa-angle-left me-2"></i>Back to Search Results</a>
            <h1 class="primary-title">Job Details</h1>

            <div>
                <h4 class="job-title text-start" th:text="${jobDetails.jobTitle}">Software Engineer</h4>
                <div class="mt-1">
                    <p class="m-0" th:if="${jobDetails.jobLocationId != null}"
                       th:text="|${jobDetails.jobLocationId.city}, ${jobDetails.jobLocationId.state}|">Joburg, South Africa</p>
                    <p class="m-0" th:if="${jobDetails.jobCompanyId != null}"
                       th:text="${jobDetails.jobCompanyId.name}">Gatesa</p>
                </div>
            </div>
        </div>

        <!-- Card 2: specs, description, actions -->
        <div class="box">
            <label class="large-label">Job Specs</label>

            <div class="job-row">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="text-start">Date Posted: <span th:text="${jobDetails.postedDate}">12 Nov, 2019</span></label>
                    </div>
                    <div class="col-md-3 text-md-center">
                        <label>Salary: <span th:text="${jobDetails.salary}">50k - 120k/y</span></label>
                    </div>
                    <div class="col-md-3 text-md-center">
                        <label>Type: <span th:text="${jobDetails.jobType}">Full-time</span></label>
                    </div>
                    <div class="col-md-3 text-md-end">
                        <label>Remote: <span th:text="${jobDetails.remote}">Remote</span></label>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="large-label">Job Description</label>
                <div class="job-description" th:utext="${jobDetails.descriptionOfJob}"></div>
            </div>

            <!-- Recruiter-only actions -->
            <div class="mt-3" sec:authorize="hasAuthority('Recruiter')">
                <div class="row g-3">
                    <div class="col-md-3">
                        <form th:action="@{/dashboard/edit/{id}(id=${jobDetails.jobPostId})}" method="post">
                            <button class="btn-sec btn-red w-100" type="submit">Edit Job</button>
                        </form>
                    </div>
                    <div class="col-md-3">
                        <form th:action="@{/dashboard/deleteJob/{id}(id=${jobDetails.jobPostId})}" method="post"
                              onsubmit="return confirm('Delete this job? This cannot be undone.');">
                            <button class="btn-sec btn-black w-100" type="submit">Delete Job</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </article>
</section>

<!-- The bundle includes Popper, which the navbar toggler needs -->
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
