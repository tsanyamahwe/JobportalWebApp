<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile Setup</title>

    <!-- Same Bootstrap version as add-jobs.html (the one that loads correctly) -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* NOTE: the coffee-mug image itself comes from .coffee_mug_background in your
           style.css / styles.css (exactly like add-jobs.html). It is NOT redefined here,
           because redefining it is what hid the image before. */

        :where(.heading_font) { font-family: 'Montserrat', sans-serif; }
        :where(.font_sub_heading_color) { color: #0b2a4a; text-transform: uppercase; }

        /* Image panel stays in view while the form scrolls (same as add-jobs.html) */
        .image-side { position: sticky; top: 0; height: 100vh; }
        .image-side .coffee_mug_background { height: 100%; }
        @media (max-width: 767.98px) { .image-side { display: none; } }

        /* Inputs and dropdowns: same height and no stray margins so rows line up */
        .job-seeker-form input.form-control:not([type="file"]),
        .job-seeker-form select.form-control {
            display: block;
            width: 100%;
            height: 62px;
            margin: 0 !important;
            box-sizing: border-box;
        }
        .btn.base_button {
            --bs-btn-bg: #ff4500;
            --bs-btn-border-color: #ff4500;
            --bs-btn-hover-bg: #e03d00;
            --bs-btn-hover-border-color: #e03d00;
            --bs-btn-active-bg: #cc3700;
            --bs-btn-active-border-color: #cc3700;
            --bs-btn-focus-shadow-rgb: 255, 69, 0;
        }
    </style>
</head>
<body>
<div class="row g-0 min-vh-100">

    <!-- LEFT: coffee mug image + logo -->
    <div class="col-md-5 image-side">
        <div class="coffee_mug_background">
            <div class="logo_left mt-3 pt-4 ms-5 ps-5">
                <h2 class="logo">gatesajobs<span class="logo_com">.com</span></h2>
            </div>
        </div>
    </div>

    <!-- RIGHT: form -->
    <div class="col-md-7">
        <div class="myForm px-4 px-lg-5 py-4">
            <form th:action="@{/job-seeker-profile/addNew}"
                  th:object="${jobSeekerProfile}"
                  method="post"
                  enctype="multipart/form-data"
                  class="job-seeker-form">

                <div class="d-flex justify-content-center pt-3">
                    <h1 class="heading_font fw-normal">Candidate</h1>
                </div>
                <div class="d-flex justify-content-center mb-3">
                    <h2 class="heading_font fw-normal">Setup your Profile</h2>
                </div>

                <!-- NAME -->
                <label class="heading_font font_sub_heading_color mb-1">Name</label>
                <div class="row align-items-start">
                    <div class="col-md-6 mb-3">
                        <input type="text" th:field="*{userAccountId}" hidden="hidden"/>
                        <input placeholder="First Name" type="text" class="form-control"
                               th:field="*{firstName}"/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <input placeholder="Last Name" type="text" class="form-control"
                               th:field="*{lastName}"/>
                    </div>
                </div>

                <!-- LOCATION -->
                <div class="row align-items-start">
                    <div class="col-md-4 mb-3">
                        <input placeholder="City" type="text" class="form-control"
                               th:field="*{city}"/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <input placeholder="State" type="text" class="form-control"
                               th:field="*{state}"/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <input placeholder="Country" type="text" class="form-control"
                               th:field="*{country}"/>
                    </div>
                </div>

                <!-- WORK CLASSIFICATION -->
                <label class="heading_font font_sub_heading_color mb-1">Work Classification</label>
                <div class="row align-items-start">
                    <div class="col-md-6 mb-3">
                        <select required class="form-control" th:field="*{workAuthorization}">
                            <option value="">Work Authorization</option>
                            <option value="US Citizen">SA Citizen</option>
                            <option value="Lesotho Citizen">Lesotho Citizen</option>
                            <option value="Liswati Citizen">Liswati Citizen</option>
                            <option value="Smart Card">Smart Card</option>
                            <option value="Green Card">Green Card</option>
                            <option value="PR Permit">PR Permit</option>
                            <option value="Work Permit">Work Permit</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <select required class="form-control" th:field="*{employmentType}">
                            <option value="">Seeking Employment</option>
                            <option value="Full Time">Full Time</option>
                            <option value="Part Time">Part Time</option>
                            <option value="Freelance">Freelance</option>
                        </select>
                    </div>
                </div>

                <!-- SKILLS -->
                <label class="heading_font font_sub_heading_color mb-1">Skills</label>
                <div class="parent" th:each="skill, iterStat : *{skills}">
                    <div class="skills-repeat">
                        <div class="row align-items-start">
                            <div class="col-md-4 mb-3">
                                <input type="text"
                                       th:field="*{skills[__${iterStat.index}__].id}"
                                       hidden="hidden"/>
                                <input placeholder="Skill Name" type="text" class="form-control"
                                       th:field="*{skills[__${iterStat.index}__].name}"/>
                            </div>
                            <div class="col-md-4 mb-3">
                                <input placeholder="Years of Experience" type="text" class="form-control"
                                       th:field="*{skills[__${iterStat.index}__].yearsOfExperience}"/>
                            </div>
                            <div class="col-md-4 mb-3">
                                <select required class="form-control"
                                        th:field="*{skills[__${iterStat.index}__].experienceLevel}">
                                    <option value="">Experience Level</option>
                                    <option value="Beginner">Beginner</option>
                                    <option value="Intermediate">Intermediate</option>
                                    <option value="Advanced">Advanced</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <button type="button" class="btn btn-outline-secondary" id="addSkill">
                        Add Skill
                    </button>
                </div>

                <!-- UPLOADS -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="heading_font font_sub_heading_color mb-1">Profile Photo</label>
                        <input sec:authorize="hasAuthority('Job Seeker')"
                               type="file" accept="image/*" class="form-control" name="image"/>
                        <input type="text" th:field="*{profilePhoto}" hidden="hidden"/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="heading_font font_sub_heading_color mb-1">Resume</label>
                        <input sec:authorize="hasAuthority('Job Seeker')"
                               type="file" accept="application/pdf" class="form-control"
                               name="pdf" required="required"/>
                        <input type="text" th:field="*{resume}" hidden="hidden"/>
                    </div>
                </div>

                <!-- SAVE -->
                <div class="d-flex justify-content-start mt-2">
                    <button type="submit" id="submit2" class="btn btn-primary base_button px-4 py-2 mb-3">Save</button>
                </div>

                <!-- Recruiters: download link, shown after the Save button -->
                <div class="d-flex justify-content-start mb-5">
                    <a sec:authorize="hasAuthority('Recruiter')"
                       th:href="@{|/job-seeker-profile/downloadResume?fileName=${jobSeekerProfile.resume}&userID=${jobSeekerProfile.userAccountId}|}"
                       class="btn btn-outline-primary">Download Resume</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- SCRIPTS (same versions as add-jobs.html) -->
<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
<script>
    $(document).ready(function () {

        // Add a new skill row by cloning the last one
        $("#addSkill").click(function () {
            var $last = $(".parent").last();
            var idx = $(".parent").length;
            var $clone = $last.clone();

            $clone.find("input, select").each(function () {
                var name = $(this).attr("name");
                if (name) {
                    $(this).attr("name", name.replace(/\[\d+\]/, "[" + idx + "]"));
                }
                var id = $(this).attr("id");
                if (id) {
                    $(this).attr("id", id.replace(/\d+/, idx));
                }
                if ($(this).is("input")) {
                    $(this).val("");
                } else {
                    $(this).prop("selectedIndex", 0);
                }
            });

            $last.after($clone);
        });
    });
</script>
</body>
</html>
